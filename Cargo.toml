[package]
name = "binport"
version = "0.1.0"
edition = "2024"
description = "Explain Linux ELF deployment compatibility without executing artifacts"
license = "MIT"

[[example]]
name = "fixture-tools"
path = "tools/fixture_tools.rs"

[dependencies]
elf = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
